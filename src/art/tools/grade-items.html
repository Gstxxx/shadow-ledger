<!doctype html>
<meta charset="utf-8" />
<body style="margin:0;background:#111">
<script>
// Tratamento das fotos de itens: recorte 4:3, grade fria (duotone parcial), contraste, vinheta e grão.
// grade(src, {fx, fy, zoom}, width, maxBytes) -> dataURL webp
const DARK = [7, 14, 18];
const MID = [70, 96, 104];
const LIGHT = [222, 236, 236];
function lerp(a, b, t) { return a + (b - a) * t; }
function curve(t) { // S suave
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
function load(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function grade(src, crop, W, maxBytes) {
  const img = await load(src);
  const H = Math.round(W * 0.75);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  // recorte cover com foco e zoom
  const ar = W / H;
  let sw = img.width, sh = img.width / ar;
  if (sh > img.height) { sh = img.height; sw = sh * ar; }
  sw /= crop.zoom || 1; sh /= crop.zoom || 1;
  let sx = (img.width - sw) * (crop.fx ?? 0.5), sy = (img.height - sh) * (crop.fy ?? 0.5);
  sx = Math.max(0, Math.min(img.width - sw, img.width * (crop.fx ?? 0.5) - sw / 2));
  sy = Math.max(0, Math.min(img.height - sh, img.height * (crop.fy ?? 0.5) - sh / 2));
  x.imageSmoothingQuality = 'high';
  x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H); const p = d.data;
  let seed = 1234567;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) / 4294967295); };
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i] / 255, g = p[i + 1] / 255, b = p[i + 2] / 255;
    let l = 0.3 * r + 0.59 * g + 0.11 * b;
    l = curve(Math.min(1, Math.max(0, (l - 0.04) * 1.08)));
    // duotone em 3 paradas
    const t = l;
    const tone = t < 0.5
      ? [lerp(DARK[0], MID[0], t * 2), lerp(DARK[1], MID[1], t * 2), lerp(DARK[2], MID[2], t * 2)]
      : [lerp(MID[0], LIGHT[0], (t - 0.5) * 2), lerp(MID[1], LIGHT[1], (t - 0.5) * 2), lerp(MID[2], LIGHT[2], (t - 0.5) * 2)];
    // mantém 28% da cor original (realismo), já esfriada
    const keep = 0.28;
    let R = lerp(tone[0], p[i] * 0.92, keep), G = lerp(tone[1], p[i + 1] * 0.98, keep), B = lerp(tone[2], Math.min(255, p[i + 2] * 1.06), keep);
    // vinheta
    const px = (i / 4) % W, py = Math.floor(i / 4 / W);
    const dx = (px / W - 0.5) * 1.15, dy = (py / H - 0.48) * 1.25;
    const v = 1 - Math.min(0.62, Math.pow(Math.sqrt(dx * dx + dy * dy), 2.2) * 0.95);
    // grão
    const n = (rnd() - 0.5) * (W > 200 ? 14 : 8);
    p[i] = Math.max(0, Math.min(255, R * v + n));
    p[i + 1] = Math.max(0, Math.min(255, G * v + n));
    p[i + 2] = Math.max(0, Math.min(255, B * v + n));
  }
  x.putImageData(d, 0, 0);
  let q = 0.82, url = c.toDataURL('image/webp', q);
  while (url.length * 0.75 > maxBytes && q > 0.4) { q -= 0.06; url = c.toDataURL('image/webp', q); }
  return { url, q: Math.round(q * 100), bytes: Math.round(url.length * 0.75) };
}
window.grade = grade;
</script>
</body>
